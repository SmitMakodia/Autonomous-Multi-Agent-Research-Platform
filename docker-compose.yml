version: '3.8'

services:
  agentforge-ui:
    build: .
    container_name: agentforge-ui
    ports:
      - "8501:8501"
    volumes:
      - ./agentforge:/app/agentforge
      - ./agentforge.log:/app/agentforge.log
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    command: streamlit run agentforge/ui/streamlit_app.py

  agentforge-api:
    build: .
    container_name: agentforge-api
    ports:
      - "8000:8000"
    volumes:
      - ./agentforge:/app/agentforge
      - ./agentforge.log:/app/agentforge.log
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    command: uvicorn agentforge.api.main:app --host 0.0.0.0 --port 8000
